name: Unpack VerZan 1.2.12
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack, check and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ZIP=VerZan_v1.2.12_site-files_2026-11-12.zip
          if [ ! -f "$ZIP" ]; then
            echo "::error::Cannot find $ZIP. Files seen: $(ls -1 | tr '\n' ' ')"
            exit 1
          fi
          unzip -q -o "$ZIP"
          rm "$ZIP"
          test -f SHA256SUMS || { echo "::error::SHA256SUMS missing after unzip"; exit 1; }
          sha256sum -c SHA256SUMS > /tmp/sums.txt || true
          cat /tmp/sums.txt
          if grep -qv ': OK$' /tmp/sums.txt; then echo "::error::Checksum mismatch, see log"; exit 1; fi
          python3 - <<'PY'
          import re,sys
          U={'index.html':('en','https://verzan.org/'),'fr/index.html':('fr','https://verzan.org/fr/'),'de/index.html':('de','https://verzan.org/de/'),'es/index.html':('es','https://verzan.org/es/'),'ja/index.html':('ja','https://verzan.org/ja/')}
          bad=0
          for f,(lang,url) in U.items():
              s=open(f,encoding='utf8').read()
              bar=re.search(r'<div class="langbar".*?</div>',s,re.S).group(0)
              links=set(re.findall(r'href="(https://verzan\.org/[a-z]*/?)"',bar))
              want={v[1] for k,v in U.items() if k!=f}
              checks={'version v1.2.12':'v1.2.12' in s,'langbar lists the other four':links==want,'canonical self':('rel="canonical" href="%s"'%url) in s,'x-default':'hreflang="x-default"' in s,'no em dash':chr(8212) not in s,'html lang':('<html lang="%s">'%lang) in s}
              for k,v in checks.items():
                  if not v: print('::error::%s: %s FAILED'%(f,k)); bad=1
              print(f,'ok' if not any(not v for v in checks.values()) else 'PROBLEM')
          sys.exit(bad)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::notice::Nothing to commit"; exit 0; }
          git commit -m "VerZan 1.2.12: English page with language links, plus fr, de, es, ja draft translations"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::notice::Pages build request not accepted; if the site does not update in 10 minutes, make any small edit in the web editor to trigger it"
